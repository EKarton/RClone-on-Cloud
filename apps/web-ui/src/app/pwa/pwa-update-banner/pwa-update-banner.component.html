<div
  class="toast toast-end toast-bottom z-50 w-full p-4 sm:w-auto"
  aria-live="polite"
  aria-atomic="true"
>
  @if (appUpdateService.unrecoverableError()) {
    <div role="alert" class="alert alert-error w-full max-w-sm shadow-lg">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 shrink-0 stroke-current"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v4m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3Z"
        />
      </svg>

      <div>
        <p class="font-semibold">Reload required</p>
        <p class="text-sm">RClone on Cloud needs to reload to recover.</p>
      </div>

      <button
        type="button"
        class="btn btn-sm btn-outline"
        (click)="appUpdateService.reload()"
        data-testid="reload-button-1"
      >
        Reload now
      </button>
    </div>
  } @else if (appUpdateService.updateAvailable()) {
    <div role="alert" class="alert alert-info w-full max-w-sm shadow-lg">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 shrink-0 stroke-current"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>

      <div>
        <p class="font-semibold">Update available</p>
        <p class="text-sm">A new version is ready to use.</p>
      </div>

      <button
        type="button"
        class="btn btn-sm btn-primary"
        (click)="appUpdateService.reload()"
        data-testid="reload-button-2"
      >
        Reload
      </button>
    </div>
  }
</div>
